name: payments

x-service-env: &service-env
  KAFKA_BOOTSTRAP: kafka:19092
  OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
  JWK_SET_URI: http://keycloak:8080/realms/payments/protocol/openid-connect/certs
  JWT_ISSUER: http://localhost:8180/realms/payments

services:
  ledger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_connections=200"]
    ports: ["5433:5432"]
    volumes: [ledger-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger_db"]
      interval: 3s
      retries: 20

  settlement-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: settlement_db
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement
    command: ["postgres", "-c", "wal_level=logical"]
    ports: ["5434:5432"]
    volumes: [settlement-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement -d settlement_db"]
      interval: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9092:9092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Every token says it came from localhost:8180, whichever address was used to get it,
      # so tokens from the browser and from inside the network validate the same way.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8080"]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  ledger-service:
    build:
      context: .
      dockerfile: ledger-service/Dockerfile
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://ledger-db:5432/ledger_db
      LEDGER_LOCKING: ${LEDGER_LOCKING:-OPTIMISTIC}
    ports: ["8081:8081"]
    depends_on:
      ledger-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  settlement-service:
    build:
      context: .
      dockerfile: settlement-service/Dockerfile
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://settlement-db:5432/settlement_db
      LEDGER_URL: http://ledger-service:8081
      TOKEN_URI: http://keycloak:8080/realms/payments/protocol/openid-connect/token
    ports: ["8082:8082"]
    depends_on:
      settlement-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
      ledger-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: seeds traders and publishes trades. Run with: docker compose run --rm trade-simulator
  trade-simulator:
    build:
      context: .
      dockerfile: trade-simulator/Dockerfile
    profiles: [demo]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      LEDGER_URL: http://ledger-service:8081
      TOKEN_URI: http://keycloak:8080/realms/payments/protocol/openid-connect/token
    depends_on:
      settlement-service: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payments.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports: ["16686:16686", "4318:4318"]

volumes:
  ledger-data:
  settlement-data:
  kafka-data:
