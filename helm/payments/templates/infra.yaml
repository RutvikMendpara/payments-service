{{- if .Values.infra.enabled }}
{{- range $db := list (dict "name" "ledger-db" "db" "ledger_db" "user" "ledger" "key" "ledger-db-password")
                      (dict "name" "settlement-db" "db" "settlement_db" "user" "settlement" "key" "settlement-db-password") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $db.name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ $db.name }}}
  template:
    metadata:
      labels: {app: {{ $db.name }}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "max_connections=200"]
          env:
            - {name: POSTGRES_DB, value: {{ $db.db }}}
            - {name: POSTGRES_USER, value: {{ $db.user }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: payments, key: {{ $db.key }}}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "{{ $db.user }}"]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $db.name }}
spec:
  selector: {app: {{ $db.name }}}
  ports: [{port: 5432}]
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
          ports: [{containerPort: 9092}]
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app: kafka}
  ports: [{port: 9092}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.2
          args: ["start-dev", "--import-realm"]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin}
            - {name: KC_HOSTNAME, value: "{{ .Values.endpoints.keycloak }}"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            periodSeconds: 5
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports: [{port: 8080}]
{{- end }}
